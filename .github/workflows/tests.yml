name: SDET Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  phase1-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements-dev.txt

      - name: Fase 1 — pytest regression
        run: |
          python -m pytest tests/api tests/s7 tests/s10 tests/security \
            api/test_settings.py s7/test_fallback.py s10/test_citimed_pipeline.py \
            -m "regression" -q --tb=short

      - name: Fase 3 — eval golden set (rápido)
        run: python tests/eval/run_eval_suite.py

  smoke:
    runs-on: ubuntu-latest
    needs: phase1-regression
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Start API
        run: |
          uvicorn api.main:app --host 127.0.0.1 --port 8000 &
          sleep 5

      - name: Fase 0 — Smoke (sin frontend)
        run: python tests/smoke/smoke.py --skip-frontend
