[pytest]
# Unificado con pyproject.toml: un solo `python -m pytest` recoge api/, s7/, s10/ y s11/.
testpaths = tests api s7/test_fallback.py s10/test_citimed_pipeline.py s11/tests s11/anonimizador_ocr/pruebas
pythonpath = .
norecursedirs = .git .venv .pytest_cache .benchmarks __pycache__ node_modules anonimizador medec_try data docs
markers =
    smoke: pruebas smoke post-deploy (Fase 0)
    regression: regresión funcional (Fase 1)
    integration: integración full-stack (Fase 2)
    eval: evaluación ML (Fase 3)
    perf: rendimiento (Fase 4)
    stress: estrés y resiliencia (Fase 5)
    security: seguridad y cumplimiento
    e2e: end-to-end UI
    requiere_ocr: requiere el binario de Tesseract; se omite si no está disponible
filterwarnings =
    ignore::DeprecationWarning
